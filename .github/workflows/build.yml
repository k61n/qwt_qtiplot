name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  linux:
    name: ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deps:
          - qtbase5-dev libqt5svg5-dev
          - qt6-base-dev qt6-svg-dev
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          sudo apt update
          sudo apt install ${{ matrix.deps }} -y
      - shell: bash
        run: |
          mkdir build && cd build
          cmake .. -G"Ninja" -DBUILD_SHARED_LIBS=ON
          cmake --build . --parallel $(nproc)

  windows:
    name: windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - id: qtsetup
        uses: k61n/qt_shared_builds/.github/actions/checkout@main
        with:
          version:  6.11.2
          compiler: msvc2022
      - shell: pwsh
        run: |
          mkdir build
          cd build
          cmake.exe .. -DBUILD_SHARED_LIBS=ON -DCMAKE_PREFIX_PATH=${{steps.qtsetup.outputs.qtpath}}
          cmake.exe --build . --config Release

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          brew install qt
      - shell: bash
        run: |
          mkdir build && cd build
          cmake .. -G"Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/qt
          cmake --build . --parallel $(sysctl -n hw.ncpu)
